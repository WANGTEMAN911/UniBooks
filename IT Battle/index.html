<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Battle</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app" class="max-w-3xl mx-auto p-4">
    <header class="flex justify-between items-center py-3">
      <h1 class="orb text-2xl text-cyan-400">IT<span class="text-violet-400">BATTLE</span></h1>
      <button class="btn text-sm" data-go="leaderboard">🏆 Reyting</button>
    </header>

    <!-- A) Welcome -->
    <section id="welcome" class="screen active panel p-6 space-y-5">
      <h2 class="orb text-xl">Arenaga kir</h2>
      <input id="nick" maxlength="16" placeholder="Nik (masalan: NullPointer)"
        class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 outline-none focus:border-cyan-400 focus:shadow-[0_0_16px_#06b6d4]">
      <div>
        <p class="mb-2 text-slate-400">Avatar</p>
        <div id="avatars" class="flex flex-wrap gap-2"></div>
      </div>
      <div>
        <p class="mb-2 text-slate-400">Unvon</p>
        <div id="titles" class="flex flex-wrap gap-2"></div>
      </div>
      <div>
        <p class="mb-2 text-slate-400">Yo'nalish</p>
        <div id="stacks" class="flex flex-wrap gap-2"></div>
      </div>
      <button id="startBtn" class="btn btn-primary w-full orb">JANGNI BOSHLASH</button>
    </section>

    <!-- B) Arena -->
    <section id="arena" class="screen panel p-6 space-y-4">
      <div class="flex justify-between orb text-sm">
        <span>Savol <b id="qNum">1</b>/<span id="qTotal">10</span></span>
        <span id="streakBadge" class="hidden fire">🔥 STREAK X2</span>
        <span class="text-yellow-300">⭐ <b id="score">0</b></span>
      </div>
      <div class="h-3 bg-slate-800 rounded-full overflow-hidden">
        <div id="timerBar" class="h-full w-full"></div>
      </div>
      <h2 id="qText" class="text-2xl font-bold leading-snug"></h2>
      <div id="options" class="grid gap-3"></div>
    </section>

    <!-- C) Game Over -->
    <section id="gameover" class="screen panel p-6 space-y-4 text-center">
      <h2 class="orb text-2xl text-yellow-300">O'YIN TUGADI</h2>
      <p class="orb text-5xl text-cyan-400" id="finalScore">0</p>
      <p id="stats" class="text-slate-300"></p>
      <div id="cardPreview" class="text-slate-400 italic"></div>
      <button id="dlBtn" class="btn btn-primary w-full">📲 Story uchun yuklab olish (1080×1920)</button>
      <div class="flex gap-3"><button class="btn flex-1" id="againBtn">Qayta o'ynash</button><button class="btn flex-1"
          data-go="leaderboard">Reyting</button></div>
    </section>

    <!-- D) Leaderboard -->
    <section id="leaderboard" class="screen panel p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="orb text-xl">Respublika reytingi</h2><button class="btn text-sm" data-go="welcome">← Orqaga</button>
      </div>
      <div class="flex gap-2"><button class="chip on" data-range="all">Umumiy</button><button class="chip"
          data-range="week">Haftalik</button></div>
      <ol id="lbList" class="space-y-2"></ol>
    </section>
  </div>

  <!-- Flex Card (ekrandan tashqarida, html2canvas uchun) -->
  <div id="flexCard">
    <p class="orb" style="font-size:56px;color:#06b6d4">IT BATTLE</p>
    <div id="fcAvatar" style="font-size:300px;margin-top:140px"></div>
    <p id="fcNick" class="orb" style="font-size:88px;margin-top:40px"></p>
    <p id="fcTitle" style="font-size:48px;color:#fbbf24"></p>
    <p id="fcText" style="font-size:64px;margin-top:140px;line-height:1.3"></p>
    <p id="fcScore" class="orb" style="font-size:150px;color:#8b5cf6;margin-top:120px"></p>
    <p style="font-size:44px;margin-top:100px;color:#94a3b8">Sen ham sinab ko'r: itbattle.uz</p>
  </div>

  <script src="app.js"></script>
</body>

</html>
